name: V2.23.1 Dynamic Version Labels

on:
  push:
    branches:
      - chore/versao-dinamica
    paths:
      - .github/workflows/v2-23-1-version-sync.yml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/versao-dinamica
          fetch-depth: 0

      - name: Aplicar versão dinâmica
        shell: python
        run: |
          from pathlib import Path

          jsp_path = Path('painel.jsp')
          js_path = Path('js/dashboard.js')
          readme_path = Path('README.md')

          jsp = jsp_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          replacements = {
              'Dados reais · Sankhya · V2.17.1': 'Dados reais · Sankhya · <span data-dm-version></span>',
              'Saúde + Curva ABC + Ranking · V2.13.2': 'Saúde + Curva ABC + Ranking · <span data-dm-version></span>',
              'Mix Comercial · V2.16': 'Mix Comercial · <span data-dm-version></span>',
              'dashboard.css?v=2.23.0': 'dashboard.css?v=2.23.1',
              'dashboard.js?v=2.23.0': 'dashboard.js?v=2.23.1',
              '<!-- V2.23.0: CSS consolidado (Visão Geral + módulos + navegação) -->': '<!-- V2.23.1: CSS consolidado (Visão Geral + módulos + navegação) -->',
              '<!-- V2.23.0: JavaScript único (regras + módulos + navegação + Visão Geral) -->': '<!-- V2.23.1: JavaScript único (regras + módulos + navegação + Visão Geral) -->',
          }
          for old, new in replacements.items():
              if old not in jsp:
                  raise SystemExit(f'Trecho esperado não encontrado no JSP: {old}')
              jsp = jsp.replace(old, new, 1)

          if 'version: "2.23.0"' not in js:
              raise SystemExit('Versão 2.23.0 não encontrada em DMRules')
          js = js.replace('version: "2.23.0"', 'version: "2.23.1"', 1)

          anchor = 'window.DM_RULES_SQL = DM_RULES_SQL;\n\n'
          if anchor not in js:
              raise SystemExit('Ponto de inserção da sincronização de versão não encontrado')

          version_sync = '''function syncDashboardVersionLabels() {\n    var label = "V" + DMRules.version;\n    var nodes = document.querySelectorAll("[data-dm-version]");\n    for (var i = 0; i < nodes.length; i++) {\n        nodes[i].textContent = label;\n    }\n}\n\nif (document.readyState === "loading") {\n    document.addEventListener("DOMContentLoaded", syncDashboardVersionLabels);\n} else {\n    syncDashboardVersionLabels();\n}\n\n'''
          js = js.replace(anchor, anchor + version_sync, 1)

          js = js.replace('DM Dashboard — V2.23.0', 'DM Dashboard — V2.23.1', 1)
          js = js.replace('DM Dashboard — V2.23.0 (consolidado)', 'DM Dashboard — V2.23.1 (consolidado)', 1)

          if '## Arquitetura V2.23.0' in readme:
              readme = readme.replace('## Arquitetura V2.23.0', '## Arquitetura V2.23.1', 1)
          marker = 'A regra financeira oficial fica centralizada no início de `dashboard.js` em `DMRules`. As consultas financeiras usam diretamente `DM_RULES_SQL`, sem interceptação ou reescrita de SQL em tempo de execução.\n'
          if marker in readme and 'data-dm-version' not in readme:
              readme = readme.replace(marker, marker + '\nA versão exibida nos módulos também vem de `DMRules.version`: os selos visuais usam `data-dm-version`, evitando versões hardcoded espalhadas pelo JSP.\n', 1)

          jsp_path.write_text(jsp, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')

      - name: Validar alteração
        shell: bash
        run: |
          set -euo pipefail
          node --check js/dashboard.js
          grep -q 'version: "2.23.1"' js/dashboard.js
          test "$(grep -o 'data-dm-version' painel.jsp | wc -l)" -eq 3
          grep -q 'dashboard.js?v=2.23.1' painel.jsp
          grep -q 'dashboard.css?v=2.23.1' painel.jsp
          ! grep -q 'Dados reais · Sankhya · V2.17.1' painel.jsp
          ! grep -q 'Saúde + Curva ABC + Ranking · V2.13.2' painel.jsp
          ! grep -q 'Mix Comercial · V2.16' painel.jsp

      - name: Commitar resultado e remover automação temporária
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/v2-23-1-version-sync.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "chore: centralizar versão visual na V2.23.1"
          git push origin HEAD:chore/versao-dinamica
