name: V2.23 Consolidate Dashboard

on:
  push:
    branches:
      - refactor/v2.23-dashboard-unico

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/v2.23-dashboard-unico

      - name: Consolidate dashboard and centralize rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          branch = "refactor/v2.23-dashboard-unico"
          core_path = Path("js/dashboard-core.js")
          panel_path = Path("painel.jsp")
          readme_path = Path("README.md")

          core = core_path.read_text(encoding="utf-8")
          panel = panel_path.read_text(encoding="utf-8")

          sale_tops = [8,2011,2019,2022,2029,2059,2073,3200,3201,3202,5119,6102,6103,6109,6110,6502,7102]
          return_tops = [2200,2201,2069,2070]
          excluded = [66178,70700,73193,77224,85850]
          companies = [1,2,3]

          def key(values):
              return tuple(sorted(values))

          SALE = key(sale_tops)
          RETURNS = key(return_tops)
          RETURNS_LEGACY = key([2200,2201])
          RETURNS_DEAD_2067 = key([2200,2201,2067,2069,2070])
          FINANCIAL = key(sale_tops + return_tops)
          FINANCIAL_LEGACY = key(sale_tops + [2200,2201])
          EXCLUDED = key(excluded)
          EXCLUDED_LEGACY = key([66178,70700,73193,77224])
          COMPANIES = key(companies)

          preamble = r'''/*
           * DM Dashboard — V2.23.0
           *
           * Arquitetura consolidada:
           * - um único JavaScript de aplicação
           * - regras financeiras centralizadas neste arquivo
           * - SQLs consomem DMRules nativamente, sem interceptação de executeQuery()
           *
           * Regra financeira validada no DBExplorer em 15/09/2026.
           */
          var DMRules = {
              version: "2.23.0",
              companies: [1, 2, 3],
              saleTops: [
                  8, 2011, 2019, 2022, 2029, 2059, 2073,
                  3200, 3201, 3202, 5119, 6102, 6103, 6109, 6110, 6502, 7102
              ],
              returnTops: [2200, 2201, 2069, 2070],
              excludedInvoices: [66178, 70700, 73193, 77224, 85850],
              commercialPeriodStartDay: 5
          };

          DMRules.financialTops = DMRules.saleTops.concat(DMRules.returnTops);

          var DM_RULES_SQL = {
              companies: DMRules.companies.join(","),
              saleTops: DMRules.saleTops.join(","),
              returnTops: DMRules.returnTops.join(","),
              financialTops: DMRules.financialTops.join(","),
              excludedInvoices: DMRules.excludedInvoices.join(",")
          };

          window.DMRules = DMRules;
          window.DM_RULES_SQL = DM_RULES_SQL;

          console.info(
              "[DM-DASHBOARD] V" + DMRules.version +
              " · regra financeira centralizada · devoluções: " + DM_RULES_SQL.returnTops
          );

          '''

          # Atualiza o cabeçalho legado sem alterar a lógica dos módulos.
          core = core.replace("DM Dashboard — V2.21.0 (consolidado)", "DM Dashboard — V2.23.0 (consolidado)", 1)

          def parse_nums(body):
              return [int(x) for x in re.findall(r"\d+", body)]

          def replace_companies(match):
              values = key(parse_nums(match.group(2)))
              if values == COMPANIES:
                  return match.group(1) + "${DM_RULES_SQL.companies}" + match.group(3)
              return match.group(0)

          core = re.sub(
              r"(\b(?:[A-Z][A-Z0-9_]*\.)?CODEMP\s+IN\s*\()([0-9,\s]+)(\))",
              replace_companies,
              core,
              flags=re.I
          )

          def replace_tops(match):
              values = key(parse_nums(match.group(2)))
              if values == SALE:
                  repl = "${DM_RULES_SQL.saleTops}"
              elif values in (RETURNS, RETURNS_LEGACY, RETURNS_DEAD_2067):
                  repl = "${DM_RULES_SQL.returnTops}"
              elif values in (FINANCIAL, FINANCIAL_LEGACY):
                  repl = "${DM_RULES_SQL.financialTops}"
              else:
                  return match.group(0)
              return match.group(1) + repl + match.group(3)

          core = re.sub(
              r"(\b(?:[A-Z][A-Z0-9_]*\.)?CODTIPOPER\s+(?:NOT\s+)?IN\s*\()([0-9,\s]+)(\))",
              replace_tops,
              core,
              flags=re.I
          )

          def replace_excluded(match):
              values = key(parse_nums(match.group(2)))
              if values in (EXCLUDED, EXCLUDED_LEGACY):
                  return match.group(1) + "${DM_RULES_SQL.excludedInvoices}" + match.group(3)
              return match.group(0)

          core = re.sub(
              r"(\b(?:[A-Z][A-Z0-9_]*\.)?NUNOTA\s+NOT\s+IN\s*\()([0-9,\s]+)(\))",
              replace_excluded,
              core,
              flags=re.I
          )

          # Visão Geral já usa esta variável; agora ela aponta para a configuração central.
          core = core.replace('var EMPRESAS_SQL = "1,2,3";', 'var EMPRESAS_SQL = DM_RULES_SQL.companies;', 1)

          # Remove a exceção histórica inativa da NUNOTA 119822.
          token = "AND CAB.NUNOTA = 119822"
          idx = core.find(token)
          if idx >= 0:
              block_start = core.rfind("\n\n    UNION ALL", 0, idx)
              block_end = core.find("\n),\nAGRUPADO AS", idx)
              if block_start < 0 or block_end < 0:
                  raise RuntimeError("Não foi possível localizar o bloco legado da NUNOTA 119822")
              core = core[:block_start] + core[block_end:]

          # O card Total Faturado é bruto, mas deve respeitar as mesmas exclusões oficiais.
          marker = ") AS TOTAL_FATURADO"
          end = core.find(marker)
          if end < 0:
              raise RuntimeError("Subconsulta TOTAL_FATURADO não encontrada")
          start = core.rfind("SELECT NVL(SUM(", 0, end)
          segment = core[start:end]
          if "NUNOTA NOT IN" not in segment:
              company_line = "AND CAB.CODEMP IN (${EMPRESAS_SQL})"
              pos = segment.rfind(company_line)
              if pos < 0:
                  raise RuntimeError("CODEMP do TOTAL_FATURADO não encontrado")
              insert_at = start + pos + len(company_line)
              core = core[:insert_at] + "\n          AND CAB.NUNOTA NOT IN (${DM_RULES_SQL.excludedInvoices})" + core[insert_at:]

          dashboard = preamble + core

          # Ajustes de interface/documentação da V2.23.
          panel = panel.replace("Faturado + Previsto", "Faturamento líquido + Previsto")
          panel = panel.replace("devoluções 2200/2201", "devoluções 2200/2201/2069/2070")
          panel = panel.replace("devoluções usam 2200/2201", "devoluções usam 2200/2201/2069/2070")
          panel = panel.replace("dashboard.js?v=2.21.0", "dashboard.js?v=2.23.0")
          panel = panel.replace("<!-- V2.21.0: JavaScript consolidado (módulos + navegação + Visão Geral) -->", "<!-- V2.23.0: JavaScript único (regras + módulos + navegação + Visão Geral) -->")

          Path("js/dashboard.js").write_text(dashboard, encoding="utf-8")
          panel_path.write_text(panel, encoding="utf-8")

          # Remove arquivos transitórios da V2.22.
          Path("js/dashboard-core.js").unlink()
          Path("js/financial-rules.js").unlink()

          # Atualiza README sem substituir o histórico existente.
          if readme_path.exists():
              readme = readme_path.read_text(encoding="utf-8")
              section = """

          ## Arquitetura V2.23.0

          A aplicação voltou a uma estrutura enxuta, sem loader intermediário:

          - `painel.jsp`: estrutura HTML do componente Sankhya;
          - `css/dashboard.css`: estilos consolidados;
          - `js/dashboard.js`: regras globais, consultas e módulos da aplicação.

          A regra financeira oficial fica centralizada no início de `dashboard.js` em `DMRules`. As consultas financeiras usam diretamente `DM_RULES_SQL`, sem interceptação ou reescrita de SQL em tempo de execução.
          """
              if "## Arquitetura V2.23.0" not in readme:
                  readme += section
                  readme_path.write_text(readme, encoding="utf-8")

          # Validações estruturais antes do commit.
          assert "NUNOTA = 119822" not in dashboard
          assert "2067" not in dashboard
          assert "dashboard-core.js" not in dashboard
          assert "financial-rules.js" not in dashboard
          assert "${DM_RULES_SQL.returnTops}" in dashboard
          assert "${DM_RULES_SQL.saleTops}" in dashboard
          assert "${DM_RULES_SQL.excludedInvoices}" in dashboard
          assert "dashboard.js?v=2.23.0" in panel

          print("V2.23 gerada com sucesso")
          print("Referências saleTops:", dashboard.count("${DM_RULES_SQL.saleTops}"))
          print("Referências returnTops:", dashboard.count("${DM_RULES_SQL.returnTops}"))
          print("Referências exclusions:", dashboard.count("${DM_RULES_SQL.excludedInvoices}"))
          PY

      - name: Validate JavaScript syntax
        run: node --check js/dashboard.js

      - name: Validate final file structure
        shell: bash
        run: |
          test -f painel.jsp
          test -f css/dashboard.css
          test -f js/dashboard.js
          test ! -e js/dashboard-core.js
          test ! -e js/financial-rules.js
          grep -q 'dashboard.js?v=2.23.0' painel.jsp
          grep -q 'var DMRules' js/dashboard.js

      - name: Commit consolidated V2.23
        shell: bash
        run: |
          rm -f .github/workflows/v2-23-consolidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidar dashboard V2.23 em arquivo unico"
          git push origin HEAD:refactor/v2.23-dashboard-unico
